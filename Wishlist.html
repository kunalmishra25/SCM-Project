<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bharat Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        body {
            line-height: 1.6;
            background-color: #e6e6e6;
        }
        header {
            background:#eee98f;
            color: black;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }
        .logo img {
            width: 100px;
            height: 100px;
        }
        .search-container {
            display: flex;
            margin-top: 0;
        }
        .signin a {
            text-decoration: none;
        }
        .search-bar {
            padding: 10px;
            width: 200px;
            height: 25px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
            outline: none;
        }
        .search-container button {
            padding: 0;
            height: 25px;
            width: 80px;
            border: none;
            background-color: #f44336;
            color: white;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }
        .nav-links {
            list-style: none;
            display: flex;
        }
        .signin img{
    width: 30px;

}
        .nav-links li {
            margin: 0 15px;
        }
        .nav-links li:hover {
            background-color: transparent;
            border-color: white;
            border: 2px solid white;
            border-radius: 3px;
        }
        .nav-links a {
            color: black;
            text-decoration: none;
            font-weight: 500;
        }
        .bag-heading p {
            font-size: x-large;
            font-weight: bolder;
            margin-left: 50px;
            margin-top: 15px;
        }
        .bag-heading small {
            margin-left: 52px;
        }
        /* Wishlist */
        .W-container {
            width: 90%;
            max-width: 1000px;
            border-radius: 10px;
            background-color: white;
            margin: 10px auto;
            display: flex;
            flex-direction: column;
            filter: drop-shadow(1px 1px 2px black);
            padding: 20px;
        }
        .W-container a {
            text-decoration: none;
            color: white;
        }
        .heading h2 {
            margin-left: 20px;
            margin-top: 10px;
        }
        .W-container table {
            width: 100%;
        }
        td input {
            width: 40px;
            height: 30px;
        }
        table img {
            width: 100px;
            height: 100px;
        }
        td {
            text-align: center;
            font-size: larger;
        }
        th {
            font-size: large;
        }
        td input {
            border: 1px solid black;
            border-radius: 5px;
            padding: 4px;
        }
        button {
            cursor: pointer;
            background-color: orangered;
            border: 1px solid black;
            color: white;
            border-radius: 5px;
            width: 80px;
            height: 30px;
        }
        .heading i {
            margin-left: 4px;
        }
        /* Footer */
        footer {
            background: #eee98f;
            color: black;
            text-align: center;
            padding: 20px 0;
            margin-top: 30px;
        }
        /* Responsive */
        @media (min-width: 768px) {
            .W-container {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
            }
            .W-container img {
                width: 150px;
                height: 150px;
            }
            .bag-heading p {
                font-size: xx-large;
            }
        }
        @media (max-width: 767px) {
            .nav-links {
                flex-direction: column;
                align-items: center;
            }
            .nav-links li {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <script>
        function cart() {
            alert("Item Added to Cart");
        }
    </script>
    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="Home Page.html">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="bharat-store-about-page (2).html">About</a></li>
                <li><a href="contact_us_1.html">Contact</a></li>
            </ul>
            <div class="signin">
                <a href="cart.html"><img src="cart.png" alt="cart" height="25px" width="25px"></a>
                <a href="Wishlist.html"><img src="fav.png" alt="wishlist" height="25px" width="25px"></a>
               
            </div>
        </nav>
    </header>
    <div class="heading">
        <h2>My Wishlist<i class="fa-solid fa-heart"></i></h2>
    </div>
    <div class="W-container">
        <table>
            <tr>
                <th>Product</th>
                <th>Unit Price</th>
                <th>Stock Status</th>
                <th>Quantity</th>
                <th>Action</th>
            </tr>
            <tr>
                <td><br><img src="skin1.jpg" alt="product"></td>
                <td>₹220/-</td>
                <td style="color:Blue;">In Stock</td>
                <td><input type="number" value="1"></td>
                <td><button onclick="cart()">Add to Cart</button></td>
            </tr>
            <tr>
                <td><img src="skin2.jpg" alt="product"></td>
                <td>₹150/-</td>
                <td style="color:Blue;">In Stock</td>
                <td><input type="number" value="1"></td>
                <td><button onclick="cart()">Add to Cart</button></td>
            </tr>
            <tr>
                <td><img src="book1.jpg" alt="product"></td>
                <td>₹350/-</td>
                <td style="color:Blue;">In Stock</td>
                <td><input type="number" value="1"></td>
                <td><button onclick="cart()">Add to Cart</button></td>
            </tr>
            <tr>
                <td><img src="cook1.webp" alt="product"></td>
                <td>₹999/-</td>
                <td style="color:Blue;">In Stock</td>
                <td><input type="number" value="1"></td>
                <td><button onclick="cart()">Add to Cart</button></td>
            </tr>
        </table>
    </div>
    <footer>
        <p>&copy; 2024 All rights reserved.</p>
    </footer>
</body>
</html>
